name: Update dashboard

# Rebuilds the Hapoel Tel Aviv dashboard and publishes it to GitHub Pages.
#
# This exists because sharing a Claude Artifact pins the shared view to the version that
# was live when sharing was enabled - a shared link never picked up later updates. A Pages
# site has a stable URL that always serves the newest deploy, so the link can be shared
# once and keeps working.
#
# Runs on GitHub's infrastructure, so it is independent of both the user's PC and Claude.

on:
  schedule:
    # BACKSTOP ONLY. The primary path is: a once-daily cloud routine that, on a day with a
    # fixture, schedules a one-off wake-up to ingest the match after full time. Live scores
    # during a match need nothing here at all - the published page fetches them from
    # 365scores in the visitor's browser.
    #
    # These slots exist purely so a failure of that chain is recovered within an hour or two
    # instead of waiting for the next morning. A run with nothing to do costs seconds and
    # changes nothing: no commit, no deploy, no page churn.
    #
    # Kept sparse on purpose. GitHub drops and delays most scheduled runs - observed firing
    # at 10:59, 17:10, 21:44 against configured :07/:37 slots - so a dense cron here would
    # be noise pretending to be a schedule.
    # Every three hours across the window Israeli matches are played and finished in
    # (17:00-23:00 UTC ~ 20:00-02:00 local), plus one mid-morning slot.
    # Minute :17 rather than :00 - GitHub itself advises against the top of the hour,
    # where load is highest and drops are worst.
    - cron: '17 8,17,20,23 * * *'
  workflow_dispatch:      # lets it be run by hand from the Actions tab
    inputs:
      demo_live:
        description: 'Show a fake in-progress match, to preview the live panel'
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    # No paths filter, deliberately. It used to list scripts/ and resources/ only, which
    # silently swallowed the cloud routine's push of data/heartbeat.txt - the routine
    # pushed successfully and nothing deployed. The published page should simply reflect
    # main, so every push to main rebuilds it. No loop risk: this workflow's own commits
    # carry [skip ci].

permissions:
  contents: write         # to commit newly ingested match records
  pages: write            # to deploy
  id-token: write         # required by actions/deploy-pages

concurrency:
  group: hta-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Fetch, aggregate and build
        run: bash scripts/run_update.sh

      # Only reachable from a hand-started run with the box ticked, so no scheduled or
      # push-triggered run can ever publish a fake match. It exists because the live panel
      # otherwise cannot be seen until a real match is under way, and "press the button and
      # watch the page change" is exactly the behaviour that needs to be trustworthy.
      # Overwrites the live file after the pipeline has run, then rebuilds the page alone -
      # the season aggregate is untouched, because the live match never enters data/matches/.
      - name: Inject a synthetic live match (manual preview only)
        if: ${{ inputs.demo_live }}
        run: |
          python - <<'PY'
          import json, pathlib
          pathlib.Path("data/live_match.json").write_text(json.dumps({
              "game_id": 9999001,
              "competition_name": "ליגת העל",
              "opponent": "קבוצת הדגמה",
              "is_home": False,
              "team_score": 1,
              "opponent_score": 1,
              "status_text": "הדגמה - לא משחק אמיתי",
              "final": False,
              "stats_complete": True,
              "events": [
                  {"minute": 12, "type_id": 1, "player": "דוגלאס אווסו",
                   "extra_player": "רוי קורין", "shootout": False},
                  {"minute": 34, "type_id": 2, "player": "אנדריאן קרייב",
                   "extra_player": None, "shootout": False},
              ],
              "players": [],
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          print("wrote a synthetic live match for preview")
          PY
          python scripts/hta_build.py

      - name: Assemble the site
        run: |
          mkdir -p site
          cp output/hta_dashboard.html site/index.html
          # A 404 that points back at the dashboard beats GitHub's default page.
          cp output/hta_dashboard.html site/404.html

      # enablement: true lets the action turn Pages on via the API using the pages:write
      # permission above, instead of depending on the repo setting having been made by
      # hand first - the first run failed for exactly that reason.
      # Optional extra page for watching the live panel work against some other club's
      # match, since Hapoel play about once a week. Reads the finished dashboard and writes
      # a separate file, so site/index.html cannot be affected by it. continue-on-error
      # because a test page is never worth failing a real deploy over.
      - name: Publish the live-panel test page, if one is configured
        continue-on-error: true
        run: |
          TEAM=$(python -c "import json;print(json.load(open('data/live_test.json')).get('team_id') or '')" 2>/dev/null || true)
          NAME=$(python -c "import json;print(json.load(open('data/live_test.json')).get('name') or '')" 2>/dev/null || true)
          if [ -n "$TEAM" ]; then
            python scripts/make_live_test.py "$TEAM" "$NAME"
            cp output/hta_live_test.html site/live-test.html
            echo "live-test.html published, following competitor $TEAM ($NAME)"
          else
            echo "no live test configured - nothing extra published"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Deliberately AFTER the deploy, and deliberately unable to fail the job.
      #
      # The published page is built from output/ in this same run - it does not come from
      # what is committed here. Git is bookkeeping: it carries match records between runs
      # and keeps this runner and the user's PC on byte-identical images. So a commit
      # problem must never cost the user a page update, which is what it used to do when
      # this step sat in front of the deploy.
      #
      # That mattered most at the worst possible moment. Between matches the writers only
      # ever add distinct files named by game id and cannot collide. During a match the
      # cloud routine and any hand-started run both rewrite the SAME file,
      # data/live_match.json, every run - so a rejected push, a conflicted rebase, and a
      # dead job were the expected case exactly when the page most needed to refresh.
      #
      # On conflict the commit is simply abandoned. Nothing is lost: every run re-fetches
      # from 365scores from scratch, so the next one re-derives and re-commits it.
      - name: Commit any newly ingested matches
        continue-on-error: true
        run: |
          if [ "${{ inputs.demo_live }}" = "true" ]; then
            echo "preview run: discarding the synthetic live match instead of committing it"
            git checkout -- data/live_match.json
          fi
          git config user.name  "HTA Stats bot"
          git config user.email "Zivgell@users.noreply.github.com"
          git add -- data/matches resources/images data/live_match.json
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "data: new match record(s) and/or player images [skip ci]"
            git push || {
              echo "push rejected; rebasing onto the remote and retrying"
              git pull --rebase origin main || {
                echo "rebase conflicted - abandoning this commit, the next run re-derives it"
                git rebase --abort || true
                exit 0
              }
              git push || echo "still could not push; the deploy already happened regardless"
            }
          fi
